name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: pytest -q

  opsd-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/opsd
          key: opsd-time-series-2020-10-06-v1
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Run OPSD DE-LU v0.1 benchmark
        run: |
          grid-intelligence benchmark \
            --download \
            --data-dir .cache/opsd \
            --output /tmp/v0.1_opsd_de_lu.json \
            | tee /tmp/v0.1_opsd_de_lu.log
      - uses: actions/upload-artifact@v4
        with:
          name: v0.1-grid-evidence
          path: /tmp/v0.1_opsd_de_lu.json
          retention-days: 14
